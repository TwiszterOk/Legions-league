<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Legions League Player Directory</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f6;--card:#fff;--ink:#1c1c1c;--mut:#666;--red:#c4202c;--gold:#c99a2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--card:#242424;--ink:#f0f0f0;--mut:#aaa;--red:#ef5059;--gold:#d9ae4a}}
:root[data-theme="dark"]{--bg:#1a1a1a;--card:#242424;--ink:#f0f0f0;--mut:#aaa;--red:#ef5059;--gold:#d9ae4a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif",Georgia,serif;padding:16px}
h1{font-family:"Lilita One",Impact,sans-serif;font-weight:400;color:var(--red);text-align:center;font-size:clamp(28px,5vw,48px);margin:4px 0}
.sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;max-width:1100px;margin:0 auto 16px}
.bar input,.bar select{font:inherit;font-size:15px;padding:10px 12px;border:3px solid var(--gold);border-radius:8px;background:var(--card);color:var(--ink);flex:1 1 180px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:3px solid var(--gold);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-weight:700;font-size:18px;word-break:break-word}
.alias{font-size:12px;color:var(--mut);font-weight:600}
.q{font-family:"Lilita One",Impact,sans-serif;color:var(--red);font-size:26px;line-height:1;text-align:right}
.q small{display:block;font-family:"Noto Serif",serif;font-size:10px;color:var(--mut);font-weight:700}
.meta{font-size:12px;color:var(--mut);font-weight:600}
.tag{display:inline-block;border:2px solid var(--gold);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.pitch{font-size:13px;line-height:1.5;font-weight:600;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.pitch.open{display:block;-webkit-line-clamp:unset}
button.more{align-self:flex-start;background:none;border:0;color:var(--red);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0}
.empty{text-align:center;color:var(--mut);padding:40px}
</style></head><body>

<script>
const D=[{"d": "#1 Roadman", "i": "VIichan6", "t": "", "q": "0.6", "z": "NA EST", "p": "U should draft me bc I am loyal, trustworthy, will have other peoples backs, will mentally talk with them about errors and solutions, and I will always try my best no matter the situation 🙏 ❤️"}, {"d": "0verthrower", "i": "0verthrower", "t": "", "q": ".7", "z": "gmt", "p": "I AM THE GREATEST .7 EVER. I WILL NEVER QD AND I WILL DEDICATE MY LIFE TO GETTING A HIGHER QUIP IN LEGIONS"}, {"d": "Alex406", "i": "Alex406", "t": "", "q": "1.3", "z": "EST", "p": "I'm quite good at the game. (check my pvphq stats if you want) and I feel I'm a little underrated. I place top 5 in both categories almost every round with 25+ people online. Also I'm 16 so I'm not stupid or a squeaker. WE know that 1.3 is the best quip."}, {"d": "AwesomeJett44", "i": "AwesomeJett44", "t": "", "q": "1.2", "z": "AEST/Oceania/Australia", "p": "Hello! I am AwesomeJett44, I am a 1.2 Pinger and I like people. PLEASE RECRUIT ME!!!"}, {"d": "Bazzable", "i": "Bazzable", "t": "", "q": "0.9", "z": "CST usa (Texas/NA central)", "p": "I'm a player that only intends to get better at any cost, you can reap the benefits of having someone who is willing to work and do whatever is ethically asked of him for the sake of self improvement in regards to legions skill. I may not be a strong pick compared to many others currently but rest assured I am an investment. I intend to grow to 1.1 by the end of october."}, {"d": "Braooh", "i": "Braooh", "t": "", "q": ".7", "z": "Gmt +1", "p": "Well if i stay at .7 when the date of LL comes around i am really worth it for my quip. Many would say im one of the best .7s (and should prob be .8 by now). I also listen to comms and i BARELY qd."}, {"d": "British_agent", "i": "British_agent", "t": "", "q": "0.6", "z": "GMT/EU", "p": "While i may be a 0.6, I am very strong in low number fights, give good comms and actually VC, I can play quite often. Moreover I am weak in this uhc style kit as I dont play in it much due to SMPs being my current main focus but I will focus a lot more in improving in this kit. I have been told I have the potential to become 0.8 or higher due to my strong melee where Ive beaten multiple 0.8 and 0.9s in 1v1s."}, {"d": "Clane", "i": "Clane_", "t": "", "q": "1.5", "z": "CET", "p": "I can left click on the same person over and over again better than most players"}, {"d": "CleanGrass", "i": "CleanGrass", "t": "", "q": "1.5", "z": "PST", "p": "The team owners should draft me as because I'm really good with comms in smaller team sizes, such as 3-15 player teams, and I have really good melee as I have 5-0ed basically every person who was my quip in legions or .1 quip higher than me that I have fought so far."}, {"d": "Clutchinton", "i": "Clutchinton", "t": "", "q": "1.5", "z": "EST", "p": "6x comp winner. Thats All."}, {"d": "CrystalFang", "i": "CrystalFang", "t": "", "q": "1.6", "z": "est", "p": "Underrated solid value pick"}, {"d": "DGSgmes", "i": "DGSgmes", "t": "", "q": "0.9", "z": "CEST", "p": "I think my damage output is good for my quip andI have decently good melee I would say so with some training and help. I can probably be really good for the amount your bidding me for your drafting me for."}, {"d": "Dbrooky", "i": "Dbrooky", "t": "", "q": "1.3", "z": "BST", "p": "I'm overall good in most aspects without much training as I have really good comms, game sense and my biggest strength is my kill pressure. With me on your team I will do everything i can to help win."}, {"d": "DistruktorVince", "i": "DistruktorVince", "t": "", "q": "0.7", "z": "PST", "p": "I just started legions and got 0.7 very quickly. I think over the course of season I will learn and perform much better."}, {"d": "Draqonate", "i": "Draqonate", "t": "", "q": "1.8", "z": "NAEST", "p": "I am a high impact player and can stall and be up on outnumbered fights easily. I have great melee and great gamesense."}, {"d": "Eigt", "i": "Eigt", "t": "", "q": "1.4", "z": "EST", "p": "I should be drafted because I am one of the best team fighters in Minecraft and I believe I have people who can vouch for me,"}, {"d": "Freekee_Fang", "i": "Freekee_Fang", "t": "", "q": "1.6 I think", "z": "EST", "p": "I'm significantly better in smaller team fights rather than larger ones."}, {"d": "HammyTheFirst", "i": "HammyTheFirst", "t": "", "q": "0.6", "z": "CST", "p": "I may not be a 1.6+ but when your almost out of draft points, I'm your guy. Just because I can't drop some of the better players doesn't mean I can't be useful, if one of my teammates are about to drop I can run into the fight an get them some time to run away and heal, I can also give my teammates gaps if they ever run out and I still have some, I can stall one or two of the other teams better players while the rest of the teams tries to drop the rest, and I can probably take fights with 1.0's and below since the skill difference isn't as high based on my experience of fight some before. I am also working on improving my skills so buying me now could be a good investment in the future."}, {"d": "Htoon", "i": "Htooncrimes", "t": "", "q": "1.5", "z": "BST", "p": "I am decently higher rated than the average player, along with that I have experience coaching and teaching weaker players so that is a another aspect of my skills that would be useful."}, {"d": "Ifny", "i": "Ifny", "t": "", "q": "1.4", "z": "EU", "p": "I can swing pretty well, team fight pretty well and survive pretty well"}, {"d": "JudicatorJuan", "i": "judicatorjuan", "t": "", "q": "1.4", "z": "MST/NA", "p": "i used to be the best funniewars player 3 years ago and im known for being really good at mcci sky battle"}, {"d": "Kelorath", "i": "Kelorath", "t": "", "q": ".8", "z": "EST", "p": "I'll ragebait the ops with sticks, string, feathers, and flint. That's all I need."}, {"d": "LiquidWren", "i": "LiquidWren", "t": "", "q": "0.8", "z": "PST", "p": "I am an evolving player and constantly strive to do better as a player in all aspects, all though I may just be a .8, I will strive to bring good damage output, good mechs, good comms, and most importantly, making sure we see that gold trophy."}, {"d": "McPaper", "i": "McWetPaper", "t": "", "q": "1.9", "z": "EST North America", "p": "I think they should draft me because I have very good team comms and have a lot of time to dedicate to the roster."}, {"d": "ModelPancake", "i": "ModelPancake", "t": "", "q": "0.7", "z": "CEST", "p": "I have way too much free time and I'm willing to put alot of time into this. Considering how low a quip I am I think I can put in alot of value that others of my level cannot. I am willing to smurf as much as possible to gain as much value for the team as I can."}, {"d": "Nightmare2g", "i": "Nightmare2g", "t": "", "q": "1.3", "z": "MST, North America", "p": "i don't drop in teamfights and often get drops"}, {"d": "NonaLion", "i": "NonaLion", "t": "", "q": "1.3", "z": "EST", "p": "I think that I am one of the best 1.3s because I have great mechanics, great gamesense, and i can give pretty good comms. With all of these qualities I think i am one of the best 1.3s which makes me a great pick for team owners."}, {"d": "Ontspot", "i": "Ontspot", "t": "", "q": ".6", "z": "NA", "p": "I play exceptionally ratty, mostly going for opportunistic 2v1s or bailing out someone getting chased. The most value I can get is supplementing a better player."}, {"d": "Paradoxi0n", "i": "Paradoxi0n", "t": "", "q": "0.9", "z": "EST", "p": "cause im freaking awesome"}, {"d": "PhoenixTBB", "i": "PhoenixTBB", "t": "", "q": "0.7", "z": "CST", "p": "I am probably one of the most underrated picks of all time im the steph curry of this draft i will be loyal to the organization and never leave"}, {"d": "Pillarger", "i": "Pillarger", "t": "", "q": "1.9", "z": "NAC", "p": "I am THE support player at the highest level!"}, {"d": "PinchPlayz", "i": "PinchPlayz", "t": "", "q": "1.3", "z": "EST", "p": "Hi, I'm Pinch. I've been playing minecraft for about 5 years, with about 2 years of that time mainly dedicated to pvp, and the rest I was either playing on and off grinding valorant or playing minigame events. However, I've been itching to come back to pvp, and with a more flexible schedule now that my main summer commitments are over, I'm ready to push myself to work on pvp again. I believe I would be a great player, as even with on and off practice over the last year I still quite easily made it too the quip of 1.3, and have years of event experience behind me, from civ events such as races too minigame events, with my most notable event in recent times being the special commissioned pandoras box, PB competitive, a crossover between PB and Funnie Wars, which I placed 6th individual in. I believe I can be a player who can both pass on experience to less excperienced players on my team, while also being someone who already has the experienced required to learn and rapidly improve through practice with those better than me. As a final note, not only do I have the schedule flexibility for practice, but should be able to make 90% of all matches atleast. If anyone has any questions, they are welcome to dm me, and I hope to see you all in legions league season 1."}, {"d": "Playertracker", "i": "playertracker", "t": "", "q": "1.3", "z": "CST", "p": "I have weaknesses but I have worked a ton on my mental which has allowed me to improve a ton recently. I am really experienced in team fighting and have a ton of experience playing with people of all skill levels which has given me the opportunity to learn what makes teams strong and how to adjust to different playstyles in order to support a team."}, {"d": "Pude", "i": "Pude", "t": "", "q": "1.4", "z": "eu", "p": "I'll consistently show up for games, practice, and anything else the team needs. I have alot of team fighting experience on Legions and I know how be a good team player. And when I'm locked in (which i will be for these matches), I can keep up at a high level"}, {"d": "PufferBucket", "i": "PufferBucket", "t": "", "q": "1.5", "z": "EST/NA", "p": "I'm 1.5 which is a bit of a mid-high quip, but I put in WORK in small fights especially. I can also stall any high quip and sometimes get the unexpected drop on them. I also have good teamwork and can build synergy with lots of different players to maximize potential. I've improved a LOT lately and have been putting up way better performances as of recent. PUT ME IN COACH"}, {"d": "Qalius", "i": "Qalius", "t": "", "q": "1.4", "z": "PST/NA west", "p": "I am likely one of the top 5 picks for 1.4, I'm very passionate when it comes to Legions (at least as of now), although my attendance wont be perfect (School overlap on weekdays), I will do everything in my power to make it. I can bring an insane amount of team morale depending on who's there with me, and I'm a great support player. maybe I'll get more drops if my aim was a bit more steady, but hey, regardless of that I am more than capable of pulling my weight, and then some."}, {"d": "Quickzol", "i": "CCTG", "t": "", "q": "1.0", "z": "UTC+2", "p": "You should draft me, because I have good gamesense, I can win my 1's and I contribute to teamfights by helping when my teammate is losing a 1v1 and going into the fight, not chasing people for half the map when they're running from me and I will be grateful to be in your team!"}, {"d": "ResidentMaster", "i": "ResidentMaster", "t": "", "q": "1.6", "z": "EST", "p": "I would like to think I am a very good support player and hope I can show that my mechanics are getting there."}, {"d": "RoyalDvck", "i": "RoyalDvck", "t": "", "q": "1.3", "z": "Nac", "p": "I'm a mechanics focused player with little show of game-sense, which makes me the perfect base for teaching improving with practice, because all I would need to improve on to get more value is decision making and positioning."}, {"d": "Rxyale", "i": "Rxyale", "t": "", "q": "0.9", "z": "EST", "p": "I am always improving, and desire to keep getting better. I believe rn I'm slightly underrated and hope to be higher quipped before this starts."}, {"d": "SarahRosemarie", "i": "SarahRosemarie", "t": "", "q": ".6", "z": "Est", "p": "Hi! My name is Sarah Marie and this is why you should draft me I have decent utilities (cobwebs lava water) decent sword and axe and I've gotten really good with a shield I can make all the times for all the weeks (worst case scenario I could be 10-20 minutes late) But that's not likely I am also committed to getting at pvp and I am willing to put in the time for the Legions League!"}, {"d": "ScarlettQrow", "i": "ScarlettQrow", "t": "", "q": "0.9", "z": "Pst", "p": "Ngl, I feel like im the ladder half of the 0.9 in terms of skill. My main strong suit is ones, and lowkey 12v12 is the games where I have the better performances. And like i said earlier i got potential to be a good option to fill in those low quip slots, without being a chud😎."}, {"d": "SleepyToons", "i": "SleepyToons", "t": "", "q": "1.4", "z": "Cst / Nac", "p": "I have played legions for a long time, I can train low quip people, and I have the most comp wins in legions rn."}, {"d": "Slockmen", "i": "Slockmen", "t": "", "q": "1.1", "z": "PST", "p": "choose me as a backup player, ima be starting college so i dont know how much time i'll have which is why I'm not selling myself too well lol"}, {"d": "Soli1d1", "i": "Soli1d1", "t": "", "q": "0.7", "z": "Pdt", "p": "You should draft be because I am quip value, I have won 2 comps with out a single promotion. If that’s not enough to sell you I don’t know what is."}, {"d": "SonnyD__", "i": "SonnyD__", "t": "", "q": "1.2", "z": "EST", "p": "I am probably the best pick in the 1.2 quip range. I am good at listening to comms and willing to learn from my peers. I can also give good comms of my own if I need to be in more of a igl spot. I can consistently get good damage and drops that show my value clear as day. I am a good teammate and I am willing to improve with my team."}, {"d": "Sylveaun", "i": "Sylveaun", "t": "", "q": "1.8", "z": "EST", "p": "do I really need to make a pitch to get drafted as a 1.8 <\/3"}, {"d": "Tackell", "i": "Tackell", "t": "", "q": "0.7", "z": "NA West/PST", "p": "Hello! My name is Tackell and I'm an experienced 0.7 on Legions! I have decent gamesense, mechs, and excellent teamwork skills. I'm overall a very solid asset to have on any team. One of my biggest strengths is being able to secure drops and help out my teammates. I'm decent in the mosh and excellent during the late and mid game."}, {"d": "TheMightyHulk", "i": "GiantGreenHulk", "t": "", "q": "1.5", "z": "NAW", "p": "I should be drafted because I am a very good team player. I do not have alot of gamesense but I am very mechanical and I can learn very quickly. I believe with a little bit of training and practice I can become a top player."}, {"d": "TripleLion", "i": "TripleLion", "t": "", "q": "2.0", "z": "PST, NA West", "p": "I will likely be unable to commit as much time as you'd want me to, so don't blindly pick me. Otherwise, though, I'm fairly capable in most aspects of Legions, though my value in smaller-team settings may not be as high as it is in 50v50 and so on."}, {"d": "VertVFX", "i": "VertVFX", "t": "", "q": "1.4", "z": "BST", "p": ""}, {"d": "VeryLargePig", "i": "VeryLargePig", "t": "", "q": "1.3", "z": "Est", "p": "Hi, I am VeryLargePig. I am currently 1.3 quip  but considered to have mechanics better than a 1.3. While my melee and mechanics are better than the average 1.3 my gamesense is worse than one. I tend to do better in smaller lobbies (10-30 players) than in bigger lobbies. I struggle a bit more in these lobbies due to it being more about gamesense instead of mechanics."}, {"d": "WOOHOOpotato", "i": "WOOHOOpotato", "t": "", "q": "1.7", "z": "GMT+3", "p": "I am a worm"}, {"d": "WhatVenom", "i": "WhatVenom", "t": "", "q": "1.2", "z": "CST North America", "p": "I'm often available, I work well with my teammates in team fights, and I believe I offer
